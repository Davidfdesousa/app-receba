<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Treino de combos de Mortal Kombat 1 com a sequência de botões no tempo certo."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Receba</title>
    <script>
      // Restores the saved theme before first paint to avoid a light/dark flash.
      try {
        const theme = localStorage.getItem('app:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
